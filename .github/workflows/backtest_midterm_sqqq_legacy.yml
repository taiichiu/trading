name: Backtest Midterm-Year SQQQ Window incl. Legacy Years (one-time)

on:
  push:
    branches: [main]

jobs:
  backtest:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SQQQ midterm-year window backtest (incl. 1994/1998/2002/2006)
        run: python scripts/backtest_midterm_sqqq.py

      - name: Commit results and delete this one-time workflow
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git rm .github/workflows/backtest_midterm_sqqq_legacy.yml
          git add data/rhymes.json data/backtests/midterm_sqqq.json
          git commit -m "chore: extend SQQQ midterm-year backtest with legacy years (1994/1998/2002/2006)"
          git push

name: One-time Full Historical Data Init

on:
  push:
    branches: [main]

jobs:
  init:
    runs-on: ubuntu-latest
    # Skip bot-pushed commits to prevent infinite loops
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch complete historical data (full mode, no incremental)
        run: python scripts/init_historical_data.py

      - name: Commit data and remove this one-time workflow
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git rm .github/workflows/one_time_full_init.yml
          git add data/indices.json
          git commit -m "chore: initialize full historical data (TAIEX from 1997, SOX added)"
          git push

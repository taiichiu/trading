name: Fetch 1990-2026 Full Historical Data

on:
  push:
    branches: [main]

jobs:
  fetch-1990:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch complete 1990-2026 historical data (full mode)
        run: python scripts/init_historical_data.py

      - name: Commit data and delete this one-time workflow
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git rm .github/workflows/fetch_1990_history.yml
          git add data/indices.json
          git commit -m "chore: fetch TAIEX/SOX from 1990 onwards, complete 1990-2026 history"
          git push

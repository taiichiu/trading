<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>規律分析儀表板｜市場韻腳資料庫</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh; padding: 1.5rem; }
  nav { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; }
  nav a { font-size: 0.85rem; color: #64748b; text-decoration: none; }
  nav a:hover { color: #e2e8f0; }
  nav span { color: #334155; }
  h2 { font-size: 1.2rem; font-weight: 500; color: #f1f5f9; margin-bottom: 0.5rem; }
  .sub { font-size: 0.82rem; color: #64748b; margin-bottom: 1.5rem; }
  .controls { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
  .control-group { display: flex; flex-direction: column; gap: 0.3rem; }
  .control-label { font-size: 0.75rem; color: #94a3b8; font-weight: 600; }
  select, input { background: #1a2333; border: 0.5px solid #334155; color: #e2e8f0;
    padding: 6px 8px; border-radius: 4px; font-size: 0.85rem; }
  select:focus, input:focus { outline: none; border-color: #3b82f6; }
  .slider-container { display: flex; gap: 0.5rem; align-items: center; }
  input[type="range"] { flex: 1; }
  .slider-value { font-size: 0.75rem; color: #64748b; min-width: 30px; text-align: right; }
  #chart { width: 100%; height: 500px; margin-bottom: 2rem; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
  .stat-box { background: #1a2333; padding: 1rem; border-radius: 8px; border: 0.5px solid #334155; }
  .stat-label { font-size: 0.75rem; color: #64748b; margin-bottom: 0.5rem; }
  .stat-value { font-size: 1.3rem; font-weight: 600; color: #38bdf8; }
  table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
  thead { background: #1a2333; }
  th, td { padding: 10px 12px; text-align: right; border-bottom: 0.5px solid #334155; font-size: 0.85rem; }
  th { font-weight: 600; color: #94a3b8; }
  td:first-child, th:first-child { text-align: left; }
  tr:hover { background: rgba(59,130,246,0.05); }
  .up { color: #ef4444; font-weight: 600; }
  .down { color: #10b981; font-weight: 600; }
  .note { margin-top: 1rem; font-size: 0.78rem; color: #475569; line-height: 1.6; }
  #lastUpdated { font-size: 0.75rem; color: #475569; margin-top: 1rem; }
  @media (max-width: 1024px) {
    .controls { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    .controls { grid-template-columns: 1fr; }
    #chart { height: 400px; }
  }
</style>
</head>
<body>

<nav>
  <a href="../index.html">← 首頁</a>
  <span>/</span>
  <span style="color:#94a3b8">規律分析儀表板</span>
</nav>

<h2>規律分析儀表板</h2>
<p class="sub">選擇時間型態，自動疊加歷史走勢，找出規律</p>

<div class="controls">
  <div class="control-group">
    <label class="control-label">關鍵日期</label>
    <select id="patternSelect">
      <option value="independence">7/4 美國獨立日</option>
      <option value="qingming">清明節 (約4/4-4/5)</option>
      <option value="dragon-boat">端午節 (農曆5/5)</option>
      <option value="mid-autumn">中秋節 (農曆8/15)</option>
      <option value="spring-festival">春節 (農曆1/1)</option>
      <option value="witching">四巫日 (3/6/9/12月第三週五)</option>
      <option value="double-ten">雙十國慶 (10/10)</option>
    </select>
  </div>

  <div class="control-group">
    <label class="control-label">前幾天</label>
    <div class="slider-container">
      <input type="range" id="daysBefore" min="0" max="30" value="5">
      <span class="slider-value" id="beforeValue">5</span>
    </div>
  </div>

  <div class="control-group">
    <label class="control-label">後幾天</label>
    <div class="slider-container">
      <input type="range" id="daysAfter" min="0" max="30" value="10">
      <span class="slider-value" id="afterValue">10</span>
    </div>
  </div>

  <div class="control-group">
    <label class="control-label">年份篩選</label>
    <select id="yearRange">
      <option value="all">所有年份</option>
      <option value="10">近10年</option>
      <option value="5">近5年</option>
      <option value="midterm">期中選舉年 (2014/18/22/26)</option>
      <option value="election">大選年 (2016/20/24/28)</option>
      <option value="digit">同尾數年</option>
    </select>
  </div>
</div>

<div id="chart"></div>

<div class="stats" id="stats"></div>

<table>
  <thead>
    <tr>
      <th>年份</th>
      <th>開盤</th>
      <th>收盤</th>
      <th>漲跌點</th>
      <th>漲跌%</th>
      <th>最高</th>
      <th>最低</th>
      <th>結果</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<div class="note">
  ※ 圖表顯示多年同期走勢（時間軸位移，以開始日期對齊）<br>
  ※ 統計為該時間窗口內的開盤到收盤表現<br>
  ※ 資料範圍：TAIEX 1997-2026
</div>
<div id="lastUpdated"></div>

<script>
let allDaily = [];
let chart = null;

// 關鍵日期定義
const patterns = {
  independence: { dates: [], desc: '7/4 美國獨立日' },
  qingming: { dates: ['2016-04-04','2017-04-04','2018-04-05','2019-04-05','2020-04-04','2021-04-05','2022-04-05','2023-04-05','2024-04-04','2025-04-04','2026-04-05'], desc: '清明節' },
  'dragon-boat': { dates: ['2016-06-09','2017-05-30','2018-06-18','2019-06-07','2020-06-25','2021-06-14','2022-06-03','2023-06-22','2024-06-10','2025-05-31','2026-06-19'], desc: '端午節' },
  'mid-autumn': { dates: ['2016-09-15','2017-10-04','2018-09-24','2019-09-13','2020-10-01','2021-09-21','2022-09-10','2023-09-29','2024-09-17','2025-10-06','2026-09-25'], desc: '中秋節' },
  'spring-festival': { dates: ['2016-02-08','2017-01-28','2018-02-16','2019-02-05','2020-01-25','2021-02-12','2022-02-01','2023-01-22','2024-02-10','2025-01-29','2026-02-17'], desc: '春節' },
  'witching': { dates: [], desc: '四巫日' },
  'double-ten': { dates: [], desc: '雙十國慶' },
};

let firstYear, lastYear;

async function init() {
  const res = await fetch('../data/indices.json?t=' + Date.now(), { cache: 'no-cache' });
  const data = await res.json();
  allDaily = (data.TAIEX && data.TAIEX.daily) || [];
  document.getElementById('lastUpdated').textContent = '數據最後更新：' + data.lastUpdated;

  if (!allDaily.length) {
    document.getElementById('chart').innerHTML = '<div style="color:#64748b;padding:2rem;text-align:center;">無資料</div>';
    return;
  }

  firstYear = +allDaily[0].date.slice(0, 4);
  lastYear = +allDaily[allDaily.length - 1].date.slice(0, 4);

  // 獨立日：每年 7/4
  patterns.independence.dates = [];
  for (let y = firstYear; y <= lastYear; y++) {
    patterns.independence.dates.push(`${y}-07-04`);
  }

  // 四巫日（3/6/9/12月第三個週五）
  patterns.witching.dates = [];
  function thirdFridayISO(year, month) {
    const first = new Date(Date.UTC(year, month - 1, 1));
    const firstFri = 1 + ((5 - first.getUTCDay() + 7) % 7);
    return new Date(Date.UTC(year, month - 1, firstFri + 14)).toISOString().slice(0, 10);
  }
  for (let y = firstYear; y <= lastYear; y++) {
    for (const m of [3, 6, 9, 12]) {
      patterns.witching.dates.push(thirdFridayISO(y, m));
    }
  }

  // 雙十：每年 10/10
  patterns['double-ten'].dates = [];
  for (let y = firstYear; y <= lastYear; y++) {
    patterns['double-ten'].dates.push(`${y}-10-10`);
  }

  bindControls();
  render();
}

function bindControls() {
  ['patternSelect', 'daysBefore', 'daysAfter', 'yearRange'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      if (id === 'daysBefore') {
        document.getElementById('beforeValue').textContent = event.target.value;
      } else if (id === 'daysAfter') {
        document.getElementById('afterValue').textContent = event.target.value;
      }
      render();
    });
    // 滑塊即時更新顯示
    if (id === 'daysBefore' || id === 'daysAfter') {
      document.getElementById(id).addEventListener('input', (e) => {
        if (id === 'daysBefore') document.getElementById('beforeValue').textContent = e.target.value;
        else document.getElementById('afterValue').textContent = e.target.value;
      });
    }
  });
}

function getChartData() {
  const pattern = document.getElementById('patternSelect').value;
  const daysBefore = +document.getElementById('daysBefore').value;
  const daysAfter = +document.getElementById('daysAfter').value;
  const yearRange = document.getElementById('yearRange').value;

  const baseDates = patterns[pattern].dates || [];
  if (!baseDates.length) return { series: [], dates: [], rows: [] };

  const dayMap = new Map();
  for (const d of allDaily) dayMap.set(d.date, d);

  const rows = [];
  const seriesMap = new Map(); // year → data points

  for (const baseDate of baseDates) {
    const baseTs = Date.parse(baseDate);
    const year = +baseDate.slice(0, 4);

    // 年份篩選邏輯
    if (yearRange === '10' && year < lastYear - 10) continue;
    if (yearRange === '5' && year < lastYear - 5) continue;
    if (yearRange === 'midterm' && ![2014, 2018, 2022, 2026].includes(year)) continue;
    if (yearRange === 'election' && ![2016, 2020, 2024, 2028].includes(year)) continue;
    if (yearRange === 'digit') {
      // 同尾數年：以當年尾數為基準
      const currentDigit = lastYear % 10;
      if (year % 10 !== currentDigit) continue;
    }

    // 收集窗口內的資料
    const windowData = [];
    let windowOpen = null, windowClose = null, windowHigh = -Infinity, windowLow = Infinity;

    for (let offset = -daysBefore; offset <= daysAfter; offset++) {
      const ts = baseTs + offset * 86400000;
      const dateStr = new Date(ts).toISOString().slice(0, 10);
      const bar = dayMap.get(dateStr);

      if (bar) {
        if (offset === -daysBefore) windowOpen = bar.open || bar.close;
        if (offset === daysAfter) windowClose = bar.close;
        if (bar.high != null) windowHigh = Math.max(windowHigh, bar.high);
        if (bar.low != null) windowLow = Math.min(windowLow, bar.low);
        windowData.push({ offset, close: bar.close });
      }
    }

    if (windowData.length > 0 && windowOpen && windowClose) {
      const change = windowClose - windowOpen;
      const changePct = (change / windowOpen * 100).toFixed(2);
      rows.push({
        year, windowOpen, windowClose, change, changePct,
        high: windowHigh === -Infinity ? null : windowHigh,
        low: windowLow === Infinity ? null : windowLow,
        isUp: change >= 0,
      });

      // 為圖表積累資料（預先填充整個陣列，缺失點填 null）
      if (!seriesMap.has(year)) {
        const arr = new Array(daysBefore + daysAfter + 1);
        seriesMap.set(year, arr);
      }
      // 計算相對開盤點的百分比漲幅
      const basePrice = windowOpen;
      windowData.forEach(d => {
        const pctChange = ((d.close - basePrice) / basePrice * 100);
        seriesMap.get(year)[d.offset + daysBefore] = +pctChange.toFixed(2);
      });
    }
  }

  rows.sort((a, b) => a.year - b.year);

  // 構建圖表 series
  const COLORS = ['#ef4444', '#f59e0b', '#3b82f6', '#10b981', '#a855f7', '#ec4899',
                  '#14b8a6', '#f97316', '#06b6d4', '#84cc16'];
  const xLabels = [];
  for (let i = -daysBefore; i <= daysAfter; i++) {
    xLabels.push(i === 0 ? '0' : (i < 0 ? i : '+' + i));
  }

  const series = Array.from(seriesMap.entries()).map(([year, data], idx) => ({
    name: String(year),
    type: 'line',
    data: data,
    smooth: false,
    connectNulls: true,
    symbol: 'circle', symbolSize: 3,
    lineStyle: { color: COLORS[idx % COLORS.length], width: 1.5 },
    itemStyle: { color: COLORS[idx % COLORS.length] },
  }));

  return { series, xLabels, rows };
}

function render() {
  const { series, xLabels, rows } = getChartData();

  // 渲染圖表
  if (!chart) chart = echarts.init(document.getElementById('chart'), 'dark');
  chart.setOption({
    backgroundColor: 'transparent',
    animation: false,
    grid: { left: 60, right: 16, top: 20, bottom: 40 },
    xAxis: {
      type: 'category', data: xLabels,
      axisLabel: { color: '#64748b', fontSize: 10 },
      axisLine: { lineStyle: { color: '#2a3547' } },
      splitLine: { lineStyle: { color: '#1e2533', type: 'dashed' } },
    },
    yAxis: {
      scale: true,
      name: '相對開盤 (%)',
      nameTextStyle: { color: '#64748b', fontSize: 10 },
      axisLabel: { color: '#64748b', fontSize: 10,
        formatter: '{value}%' },
      axisLine: { lineStyle: { color: '#2a3547' } },
      splitLine: { lineStyle: { color: '#1e2533' } },
    },
    tooltip: {
      trigger: 'axis', backgroundColor: '#1a2233', borderColor: '#334155',
      textStyle: { color: '#e2e8f0', fontSize: 11 },
    },
    legend: { textStyle: { color: '#94a3b8' }, top: 10 },
    series,
  }, true);

  // 渲染統計框
  if (rows.length > 0) {
    const upCount = rows.filter(r => r.isUp).length;
    const downCount = rows.length - upCount;
    const upRate = (upCount / rows.length * 100).toFixed(1);
    const avgChange = (rows.reduce((s, r) => s + r.change, 0) / rows.length).toFixed(0);
    const avgPct = (rows.reduce((s, r) => s + parseFloat(r.changePct), 0) / rows.length).toFixed(2);

    document.getElementById('stats').innerHTML = `
      <div class="stat-box">
        <div class="stat-label">上漲次數 / 勝率</div>
        <div class="stat-value" style="color:#ef4444;">${upCount} / ${upRate}%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">下跌次數</div>
        <div class="stat-value" style="color:#10b981;">${downCount}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">平均漲跌點</div>
        <div class="stat-value" style="color:${avgChange>=0?'#ef4444':'#10b981'}">${avgChange>=0?'+':''}${avgChange}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">平均漲跌%</div>
        <div class="stat-value" style="color:${avgPct>=0?'#ef4444':'#10b981'}">${avgPct>=0?'+':''}${avgPct}%</div>
      </div>
    `;
  }

  // 渲染表格
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = rows.map(r => `
    <tr>
      <td><strong>${r.year}</strong></td>
      <td>${r.windowOpen.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
      <td>${r.windowClose.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
      <td class="${r.isUp ? 'up' : 'down'}">${r.isUp ? '+' : ''}${r.change.toLocaleString(undefined, { maximumFractionDigits: 0 })}</td>
      <td class="${r.isUp ? 'up' : 'down'}">${r.isUp ? '+' : ''}${r.changePct}%</td>
      <td>${r.high?.toLocaleString(undefined, { maximumFractionDigits: 0 }) || '—'}</td>
      <td>${r.low?.toLocaleString(undefined, { maximumFractionDigits: 0 }) || '—'}</td>
      <td>${r.isUp ? '📈 上漲' : '📉 下跌'}</td>
    </tr>
  `).join('') || '<tr><td colspan="8" style="text-align:center;color:#64748b;">無符合資料</td></tr>';

  window.addEventListener('resize', () => { if (chart) chart.resize(); });
}

init();
</script>
</body>
</html>

<script>
const UP_COLOR = '#ef4444';      // red (up) - TW convention
const DOWN_COLOR = '#10b981';    // green (down) - TW convention
const VOLUME_UP = '#7f1d1d';
const VOLUME_DOWN = '#064e3b';

const BUFFETT_COLOR = '#fbbf24';  // amber

let chart, rawDaily = [], buffettData = null, celestial = null;
let currentRange = '1y', currentTimeframe = 'daily';
let overlayBuffett = false;
const selectedPlanets = new Set();   // zh names: 火星, 金星, ...
const visToggles = { arrows: true, labels: true, retro: true };
const calendarToggles = { festival: false, witching: false };
const yearMarkToggles = { election: false, midterm: false, digit: false };
const YEARMARK_COLOR = { election: 'rgba(168,85,247,0.10)', midterm: 'rgba(56,189,248,0.10)', digit: 'rgba(251,191,36,0.10)' };
const YEARMARK_LABEL = { election: '大選年', midterm: '期中選舉年', digit: '同尾數年' };

// 春節/端午/中秋 Gregorian dates (lunar festivals). We mark the LAST TRADING DAY
// BEFORE each — i.e. the market's 封關日 right before the holiday closure.
const FESTIVAL_DATES = {
  '春節': ['2015-02-19','2016-02-08','2017-01-28','2018-02-16','2019-02-05',
           '2020-01-25','2021-02-12','2022-02-01','2023-01-22','2024-02-10',
           '2025-01-29','2026-02-17','2027-02-06','2028-01-26','2029-02-13','2030-02-03'],
  '端午': ['2015-06-20','2016-06-09','2017-05-30','2018-06-18','2019-06-07',
           '2020-06-25','2021-06-14','2022-06-03','2023-06-22','2024-06-10',
           '2025-05-31','2026-06-19','2027-06-09','2028-05-28','2029-06-16','2030-06-05'],
  '中秋': ['2015-09-27','2016-09-15','2017-10-04','2018-09-24','2019-09-13',
           '2020-10-01','2021-09-21','2022-09-10','2023-09-29','2024-09-17',
           '2025-10-06','2026-09-25','2027-09-15','2028-10-03','2029-09-22','2030-09-12'],
};
const FESTIVAL_COLOR = { '春節': '#f43f5e', '端午': '#22c55e', '中秋': '#eab308' };
const WITCHING_COLOR = '#38bdf8';

// Bars per range, by timeframe — used to compute initial data zoom window.
const BARS_PER_RANGE = {
  daily:   { '3m': 63,  '6m': 126, '1y': 252 },
  weekly:  { '3m': 13,  '6m': 26,  '1y': 52  },
  monthly: { '3m': 3,   '6m': 6,   '1y': 12  },
};

let baseStatus = '';
function updateStatus() {
  // bottom status line (existing)
  let s = baseStatus;
  if (celestial && selectedPlanets.size > 0) {
    let transit = 0, station = 0;
    for (const e of celestial.all) {
      if (!selectedPlanets.has(e.planet)) continue;
      const t = e.type || 'transit';
      if (t === 'transit') transit++;
      else if (t === 'station') station++;
    }
    s += `　｜　已選 ${selectedPlanets.size} 顆，轉星座 ${transit} / 順逆行 ${station}`;
  }
  document.getElementById('lastUpdated').textContent = s;

  // top status pill next to controls — always visible
  const cs = document.getElementById('celestialStatus');
  if (!cs) return;
  if (!celestial) {
    cs.textContent = '⚠ 天體資料未載入（看 console 錯誤）';
    cs.style.color = '#f87171';
  } else if (selectedPlanets.size === 0) {
    cs.textContent = `已載入 ${celestial.all.length} 個事件，請點選行星`;
    cs.style.color = '#64748b';
  } else {
    let transit = 0, station = 0;
    for (const e of celestial.all) {
      if (!selectedPlanets.has(e.planet)) continue;
      const t = e.type || 'transit';
      if (t === 'transit') transit++;
      else if (t === 'station') station++;
    }
    cs.textContent = `已選 ${selectedPlanets.size} 顆 → 應渲染 ${transit + station} 點 (轉星座 ${transit} + 順逆行 ${station})`;
    cs.style.color = '#fbbf24';
  }
}

async function init() {
  const [indicesRes, buffettRes, celestialRes] = await Promise.all([
    fetch('../data/indices.json?t=' + Date.now(), { cache: 'no-cache' }).then(r => r.json()),
    fetch('../data/buffett.json?t=' + Date.now(), { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null),
    (window.Celestial ? Celestial.load() : Promise.resolve(null)).catch(err => {
      console.error('Celestial load failed:', err);
      return null;
    }),
  ]);
  rawDaily = (indicesRes.TAIEX && indicesRes.TAIEX.daily) || [];
  buffettData = buffettRes;
  celestial = celestialRes;

  baseStatus = '數據最後更新：' + (indicesRes.lastUpdated || '—') +
    '　｜　日K筆數：' + rawDaily.length.toLocaleString() +
    (celestial ? '　｜　天體事件：' + celestial.all.length : '　｜　天體未載入');
  updateStatus();

  bindButtons('.tf-btn',    'tf',    v => { currentTimeframe = v; });
  bindButtons('.range-btn', 'range', v => { currentRange = v; });
  bindOverlayButtons();
  bindCelestialButtons();
  bindCalendarButtons();
  bindYearMarkButtons();
  renderChart();
}

function bindCelestialButtons() {
  document.querySelectorAll('.planet-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      const p = btn.dataset.planet;
      if (selectedPlanets.has(p)) selectedPlanets.delete(p);
      else selectedPlanets.add(p);
      btn.classList.toggle('on');
      updateStatus();
      renderChart();
    });
  });
  document.querySelectorAll('.celestial-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.vis;
      visToggles[k] = !visToggles[k];
      btn.classList.toggle('on');
      renderChart();
    });
  });
}

function bindCalendarButtons() {
  document.querySelectorAll('.calendar-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.cal;
      calendarToggles[k] = !calendarToggles[k];
      btn.classList.toggle('active');
      renderChart();
    });
  });
}

function bindYearMarkButtons() {
  document.querySelectorAll('.yearmark-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.yearmark;
      yearMarkToggles[k] = !yearMarkToggles[k];
      btn.classList.toggle('active');
      renderChart();
    });
  });
}

// Map an ISO date to the nearest category index in the current series dates.
// Shared by celestial markPoints and the festival/witching markLines.
function makeDateIndexer(seriesDates) {
  const dateToIdx = new Map();
  const seriesTs = new Array(seriesDates.length);
  for (let i = 0; i < seriesDates.length; i++) {
    const d = seriesDates[i];
    dateToIdx.set(d, i);
    seriesTs[i] = Date.parse(d.length === 7 ? d + '-15' : d);
  }
  return function nearestIdx(d) {
    if (dateToIdx.has(d)) return dateToIdx.get(d);
    if (currentTimeframe === 'monthly') {
      const ym = d.slice(0, 7);
      return dateToIdx.has(ym) ? dateToIdx.get(ym) : -1;
    }
    const ts = Date.parse(d);
    if (isNaN(ts) || ts < seriesTs[0] || ts > seriesTs[seriesTs.length - 1]) return -1;
    let lo = 0, hi = seriesTs.length - 1;
    while (lo < hi - 1) {
      const mid = (lo + hi) >> 1;
      if (seriesTs[mid] < ts) lo = mid; else hi = mid;
    }
    return Math.abs(seriesTs[lo] - ts) <= Math.abs(seriesTs[hi] - ts) ? lo : hi;
  };
}

// Third Friday of (year, month) as ISO — US quadruple-witching date.
function thirdFridayISO(year, month) {
  const first = new Date(Date.UTC(year, month - 1, 1));
  const firstFri = 1 + ((5 - first.getUTCDay() + 7) % 7);
  return new Date(Date.UTC(year, month - 1, firstFri + 14)).toISOString().slice(0, 10);
}

// Binary searches over rawDaily (sorted ascending) — returns an actual trading day.
function lastTradingDayBefore(iso) {
  let lo = 0, hi = rawDaily.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1;
    if (rawDaily[mid].date < iso) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans >= 0 ? rawDaily[ans].date : null;
}
function tradingDayOnOrBefore(iso) {
  let lo = 0, hi = rawDaily.length - 1, ans = -1;
  while (lo <= hi) { const mid = (lo + hi) >> 1;
    if (rawDaily[mid].date <= iso) { ans = mid; lo = mid + 1; } else hi = mid - 1; }
  return ans >= 0 ? rawDaily[ans].date : null;
}

// Vertical markLines for 節日封關日 (festival last trading day) + 四巫日 (witching).
function buildCalendarMarkLine(seriesDates) {
  if (!rawDaily.length) return undefined;
  if (!calendarToggles.festival && !calendarToggles.witching) return undefined;
  const nearestIdx = makeDateIndexer(seriesDates);
  const data = [];

  // A resolved trading day too far from the event means the event is in the
  // future (or in a data gap) and lastTradingDayBefore fell back to the last
  // bar — skip it so we don't mislabel an unrelated K-bar.
  const gapDays = (eventISO, td) => (Date.parse(eventISO) - Date.parse(td)) / 86400000;

  if (calendarToggles.festival) {
    for (const [name, dates] of Object.entries(FESTIVAL_DATES)) {
      const color = FESTIVAL_COLOR[name];
      for (const fday of dates) {
        const td = lastTradingDayBefore(fday);
        if (!td || gapDays(fday, td) > 15) continue;
        const idx = nearestIdx(td);
        if (idx < 0) continue;
        data.push({
          xAxis: idx,
          lineStyle: { color, type: 'dashed', width: 1, opacity: 0.6 },
          label: { show: true, formatter: name + '封關', position: 'end',
            color: '#0f172a', backgroundColor: color, padding: [2, 4],
            borderRadius: 3, fontSize: 10, fontWeight: 500 },
        });
      }
    }
  }

  if (calendarToggles.witching) {
    const firstY = +rawDaily[0].date.slice(0, 4);
    const lastY = +rawDaily[rawDaily.length - 1].date.slice(0, 4);
    for (let y = firstY; y <= lastY; y++) {
      for (const m of [3, 6, 9, 12]) {
        const wISO = thirdFridayISO(y, m);
        const td = tradingDayOnOrBefore(wISO);
        if (!td || gapDays(wISO, td) > 7) continue;
        const idx = nearestIdx(td);
        if (idx < 0) continue;
        data.push({
          xAxis: idx,
          lineStyle: { color: WITCHING_COLOR, type: 'solid', width: 1, opacity: 0.4 },
          label: { show: true, formatter: '四巫', position: 'start',
            color: '#0f172a', backgroundColor: WITCHING_COLOR, padding: [2, 4],
            borderRadius: 3, fontSize: 10, fontWeight: 500 },
        });
      }
    }
  }

  if (!data.length) return undefined;
  return { silent: true, symbol: 'none', data };
}

// Background shading (markArea) for selected year cohorts (election/midterm/
// same-last-digit), so recurring year-types can be visually spotted on the
// continuous K-line without breaking chronological continuity.
function buildYearMarkArea(seriesDates) {
  if (!rawDaily.length) return undefined;
  const active = Object.keys(yearMarkToggles).filter(k => yearMarkToggles[k]);
  if (!active.length) return undefined;

  const nearestIdx = makeDateIndexer(seriesDates);
  const firstYr = +rawDaily[0].date.slice(0, 4);
  const lastYr = +rawDaily[rawDaily.length - 1].date.slice(0, 4);
  const data = [];

  for (const kind of active) {
    const color = YEARMARK_COLOR[kind];
    const label = YEARMARK_LABEL[kind];
    for (let y = firstYr; y <= lastYr; y++) {
      let match;
      if (kind === 'election') match = y % 4 === 0;
      else if (kind === 'midterm') match = y % 4 === 2;
      else if (kind === 'digit') match = y % 10 === (lastYr % 10);
      if (!match) continue;

      const startIdx = nearestIdx(`${y}-01-01`);
      const endIdx = nearestIdx(`${y}-12-31`);
      if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) continue;

      data.push([
        { xAxis: startIdx, itemStyle: { color },
          label: { show: true, formatter: label, position: 'insideTop',
            color: '#94a3b8', fontSize: 9 } },
        { xAxis: endIdx },
      ]);
    }
  }

  if (!data.length) return undefined;
  return { silent: true, data };
}

// Build markPoint config to attach to the candlestick series.
// markPoint is ECharts' standard way to annotate candlestick bars.
function buildCelestialMarkPoint(seriesDates, candles) {
  if (!celestial || !visToggles.arrows || selectedPlanets.size === 0) return undefined;
  const events = celestial.all.filter(e => {
    const t = e.type || 'transit';
    return (t === 'transit' || t === 'station') && selectedPlanets.has(e.planet);
  });
  if (!events.length) return undefined;

  const nearestIdx = makeDateIndexer(seriesDates);

  // Stagger each planet to its own vertical band above the chart by using
  // candle.high as base + a planet-specific multiplier.
  let yMax = -Infinity, yMin = Infinity;
  for (const c of candles) {
    if (c[3] != null && c[3] > yMax) yMax = c[3];
    if (c[2] != null && c[2] < yMin) yMin = c[2];
  }
  if (yMax === -Infinity) return undefined;
  const yRange = yMax - yMin;
  const planetBand = {
    '水星': 0.18, '金星': 0.16, '火星': 0.14,
    '木星': 0.12, '土星': 0.10, '天王星': 0.08,
    '海王星': 0.06, '冥王星': 0.04, '北交點': 0.02,
  };

  const points = [];
  for (const ev of events) {
    const idx = nearestIdx(ev.date);
    if (idx < 0) continue;
    const meta = Celestial.planetMeta(ev.planet);
    const color = meta ? meta.color : '#94a3b8';
    const label = visToggles.labels
      ? Celestial.eventLabel(ev, { showRetro: visToggles.retro })
      : Celestial.eventLabel(ev, { compact: true, showRetro: visToggles.retro });

    const isStation = (ev.type === 'station');
    const offset = planetBand[ev.planet] ?? 0.10;
    const y = yMax + yRange * offset;

    points.push({
      coord: [idx, y],
      symbol: isStation ? 'arrow' : 'circle',
      symbolRotate: isStation ? 180 : 0,
      symbolSize: isStation ? 14 : 8,
      itemStyle: { color, borderColor: '#0f172a', borderWidth: 0.5 },
      label: {
        show: true,
        formatter: label,
        position: isStation ? 'top' : 'right',
        distance: 4,
        color: '#0f172a',
        backgroundColor: color,
        padding: [2, 5],
        borderRadius: 3,
        fontSize: 11,
        fontWeight: 500,
      },
    });
  }
  console.log('[celestial] buildCelestialMarkPoint →',
    { selected: [...selectedPlanets], events: events.length, rendered: points.length,
      yMax, yMin, sample: points[0] });
  if (!points.length) return undefined;
  return { silent: true, animation: false, data: points };
}

// Overlay buttons toggle (multi-select-able, currently just 巴菲特)
function bindOverlayButtons() {
  document.querySelectorAll('.overlay-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const k = btn.dataset.overlay;
      if (k === 'buffett') overlayBuffett = !overlayBuffett;
      btn.classList.toggle('active');
      renderChart();
    });
  });
}

// Build a dense buffett series by linear-interpolating annual data points
// across every series date, so the line is visible in any zoom range.
function buildBuffettSeries(seriesDates) {
  if (!buffettData || !buffettData.annual || buffettData.annual.length === 0) return [];
  const ann = buffettData.annual.map(it => ({
    ts: new Date(it.date + 'T00:00:00Z').getTime(),
    v: it.value,
  })).sort((a, b) => a.ts - b.ts);
  const first = ann[0], last = ann[ann.length - 1];

  const out = [];
  for (const d of seriesDates) {
    // d is 'YYYY-MM-DD' (daily/weekly) or 'YYYY-MM' (monthly view)
    const dateStr = d.length === 7 ? d + '-15' : d;
    const ts = new Date(dateStr + 'T00:00:00Z').getTime();
    let v;
    if (ts <= first.ts) v = first.v;
    else if (ts >= last.ts) v = last.v;
    else {
      for (let i = 0; i < ann.length - 1; i++) {
        if (ts >= ann[i].ts && ts <= ann[i + 1].ts) {
          const r = (ts - ann[i].ts) / (ann[i + 1].ts - ann[i].ts);
          v = ann[i].v + (ann[i + 1].v - ann[i].v) * r;
          break;
        }
      }
    }
    out.push([d, +v.toFixed(2)]);
  }
  return out;
}

function bindButtons(selector, dataKey, setter) {
  document.querySelectorAll(selector).forEach(btn => {
    btn.addEventListener('click', () => {
      setter(btn.dataset[dataKey]);
      document.querySelectorAll(selector).forEach(b =>
        b.classList.toggle('active', b === btn));
      renderChart();
    });
  });
}

// Aggregate daily OHLCV into weekly/monthly buckets.
function aggregate(daily, tf) {
  if (tf === 'daily' || daily.length === 0) return daily;

  const keyOf = (dateStr) => {
    if (tf === 'monthly') return dateStr.slice(0, 7); // YYYY-MM
    // weekly: align to ISO week's Monday
    const dt = new Date(dateStr + 'T00:00:00Z');
    const day = dt.getUTCDay() || 7; // Sunday=7, Monday=1
    const monday = new Date(dt);
    monday.setUTCDate(dt.getUTCDate() - day + 1);
    return monday.toISOString().slice(0, 10);
  };

  const groups = new Map();
  daily.forEach(d => {
    const k = keyOf(d.date);
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(d);
  });

  const out = [];
  Array.from(groups.keys()).sort().forEach(k => {
    const rows = groups.get(k);
    const highs = rows.map(r => r.high).filter(v => v != null);
    const lows  = rows.map(r => r.low ).filter(v => v != null);
    out.push({
      date: rows[rows.length - 1].date,
      open: rows[0].open,
      close: rows[rows.length - 1].close,
      high: highs.length ? Math.max(...highs) : null,
      low:  lows.length  ? Math.min(...lows)  : null,
      volume: rows.reduce((s, r) => s + (r.volume || 0), 0),
    });
  });
  return out;
}

function computeDataZoom(n) {
  if (n === 0) return { start: 0, end: 100 };
  if (currentRange === 'all') return { start: 0, end: 100 };

  const wanted = (BARS_PER_RANGE[currentTimeframe] || {})[currentRange];
  if (!wanted || wanted >= n) return { start: 0, end: 100 };

  const startIdx = Math.max(0, n - wanted);
  return { start: (startIdx / (n - 1)) * 100, end: 100 };
}

function renderChart() {
  if (!chart) chart = echarts.init(document.getElementById('chart'), 'dark');

  const series = aggregate(rawDaily, currentTimeframe);

  const tc = '#64748b', gc = '#1e2533', lc = '#2a3547';
  const dates = series.map(d =>
    currentTimeframe === 'monthly' ? d.date.slice(0, 7) : d.date
  );
  // ECharts candlestick expects [open, close, low, high]
  const candles = series.map(d => [d.open, d.close, d.low, d.high]);

  // Compute price range so we can extend yAxis max when celestial markers are active.
  // markPoint coords above yAxis.max are clipped — we must explicitly set max.
  let priceMax = -Infinity, priceMin = Infinity;
  for (const c of candles) {
    if (c[3] != null && c[3] > priceMax) priceMax = c[3]; // high
    if (c[2] != null && c[2] < priceMin) priceMin = c[2]; // low
  }
  const priceRange = priceMax !== -Infinity ? priceMax - priceMin : 0;
  const celestialAxisMax = (celestial && selectedPlanets.size > 0 && visToggles.arrows && priceMax !== -Infinity)
    ? priceMax + priceRange * 0.22   // 0.22 > max planetBand offset (0.18 for 水星) + padding
    : undefined;

  const volumes = series.map(d => ({
    value: d.volume || 0,
    itemStyle: {
      color: (d.close >= d.open) ? VOLUME_UP : VOLUME_DOWN
    }
  }));

  const zoom = computeDataZoom(series.length);
  const narrow = window.innerWidth < 640;

  chart.setOption({
    backgroundColor: 'transparent',
    animation: false,
    axisPointer: { link: [{ xAxisIndex: 'all' }] },
    grid: [
      { left: narrow ? 56 : 72, right: 16, top: 30, height: '62%' },
      { left: narrow ? 56 : 72, right: 16, top: '76%', height: '14%' }
    ],
    xAxis: [
      {
        type: 'category', data: dates, boundaryGap: true,
        axisLine: { lineStyle: { color: lc } },
        axisLabel: { color: tc, fontSize: narrow ? 10 : 11 },
        splitLine: { show: false },
        axisPointer: { label: { backgroundColor: '#1a2233' } }
      },
      {
        type: 'category', gridIndex: 1, data: dates, boundaryGap: true,
        axisLine: { lineStyle: { color: lc } },
        axisLabel: { show: false },
        axisTick: { show: false },
        splitLine: { show: false }
      }
    ],
    yAxis: [
      {
        scale: true,
        max: celestialAxisMax,
        name: '點數', nameTextStyle: { color: tc, fontSize: 10, padding: [0, 0, 0, narrow ? 20 : 40] },
        axisLine: { lineStyle: { color: lc } },
        axisLabel: { color: tc, fontSize: narrow ? 10 : 11,
          formatter: v => v >= 10000 ? (v/1000).toFixed(1)+'K' : v },
        splitLine: { lineStyle: { color: gc, type: 'dashed' } }
      },
      {
        scale: true, gridIndex: 1,
        axisLine: { lineStyle: { color: lc } },
        axisLabel: { color: tc, fontSize: 9,
          formatter: v => v === 0 ? '' : (v >= 1e8 ? (v/1e8).toFixed(1)+'億' :
            (v >= 1e4 ? (v/1e4).toFixed(0)+'萬' : v)) },
        splitLine: { show: false }
      },
      // [2] Buffett indicator (right-side %, on main grid)
      {
        scale: true, gridIndex: 0, position: 'right',
        name: overlayBuffett ? '巴菲特(%)' : '',
        nameTextStyle: { color: BUFFETT_COLOR, fontSize: 10 },
        axisLine: { show: overlayBuffett, lineStyle: { color: BUFFETT_COLOR } },
        axisTick: { show: overlayBuffett },
        axisLabel: { show: overlayBuffett, color: BUFFETT_COLOR, fontSize: 10,
          formatter: '{value}%' },
        splitLine: { show: false },
      }
    ],
    dataZoom: [
      {
        type: 'inside', xAxisIndex: [0, 1],
        start: zoom.start, end: zoom.end, zoomOnMouseWheel: true
      },
      {
        type: 'slider', xAxisIndex: [0, 1],
        bottom: 0, height: 18,
        start: zoom.start, end: zoom.end,
        textStyle: { color: tc, fontSize: 10 },
        borderColor: '#334155', backgroundColor: '#1a2233',
        fillerColor: 'rgba(59,130,246,0.12)',
        handleStyle: { color: '#3b82f6' },
        moveHandleStyle: { color: '#3b82f6' }
      }
    ],
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'cross' },
      backgroundColor: '#1a2233', borderColor: '#334155',
      textStyle: { color: '#e2e8f0', fontSize: 12 },
      formatter: params => {
        if (!params || !params.length) return '';
        const i = params[0].dataIndex;
        const d = series[i];
        if (!d) return '';
        const chg = d.close - d.open;
        const chgPct = d.open ? (chg / d.open * 100) : 0;
        const chgColor = chg >= 0 ? UP_COLOR : DOWN_COLOR;
        const sign = chg >= 0 ? '+' : '';
        const fmt = v => (v == null ? '—' : v.toLocaleString(undefined, { maximumFractionDigits: 2 }));
        const fmtVol = v => {
          if (!v) return '—';
          if (v >= 1e8) return (v / 1e8).toFixed(2) + ' 億';
          if (v >= 1e4) return (v / 1e4).toFixed(0) + ' 萬';
          return v.toLocaleString();
        };
        const tfLabel = { daily: '日K', weekly: '週K', monthly: '月K' }[currentTimeframe];
        const dateLabel = currentTimeframe === 'monthly' ? d.date.slice(0, 7) : d.date;

        let extra = '';
        if (overlayBuffett && buffettData && buffettData.annual) {
          const yr = d.date.slice(0, 4);
          // Latest annual data point on or before current year
          let bv = null;
          for (const it of buffettData.annual) {
            if (it.date.slice(0, 4) <= yr) bv = it.value;
          }
          if (bv != null) {
            extra = `<br/><span style="color:${BUFFETT_COLOR}">巴菲特指標</span> ` +
              `<b style="color:${BUFFETT_COLOR}">${bv}%</b> <span style="color:${tc};font-size:10px">(年度近似值)</span>`;
          }
        }

        return `<b>${dateLabel}</b> <span style="color:${tc};font-size:10px">(${tfLabel})</span><br/>` +
          `<span style="color:${tc}">開</span> ${fmt(d.open)}　` +
          `<span style="color:${tc}">高</span> ${fmt(d.high)}<br/>` +
          `<span style="color:${tc}">低</span> ${fmt(d.low)}　` +
          `<span style="color:${tc}">收</span> <b style="color:${chgColor}">${fmt(d.close)}</b><br/>` +
          `<span style="color:${tc}">漲跌</span> <span style="color:${chgColor}">${sign}${fmt(chg)} (${sign}${chgPct.toFixed(2)}%)</span><br/>` +
          `<span style="color:${tc}">量</span> ${fmtVol(d.volume)}` + extra;
      }
    },
    series: [
      {
        name: 'TAIEX', type: 'candlestick',
        data: candles,
        itemStyle: {
          color: UP_COLOR, color0: DOWN_COLOR,
          borderColor: UP_COLOR, borderColor0: DOWN_COLOR
        },
        markPoint: buildCelestialMarkPoint(dates, candles),
        markLine: buildCalendarMarkLine(dates),
        markArea: buildYearMarkArea(dates),
      },
      {
        name: '成交量', type: 'bar',
        xAxisIndex: 1, yAxisIndex: 1,
        data: volumes,
        barWidth: '60%'
      },
      ...(overlayBuffett ? [{
        name: '巴菲特指標',
        type: 'line',
        yAxisIndex: 2,
        data: buildBuffettSeries(dates),
        showSymbol: false,
        lineStyle: { color: BUFFETT_COLOR, width: 2 },
        itemStyle: { color: BUFFETT_COLOR },
        smooth: true,
        z: 6,
        tooltip: { valueFormatter: v => v + '%' },
      }] : [])
    ]
  }, true);
}

window.addEventListener('resize', () => { if (chart) { chart.resize(); renderChart(); } });
init();
</script>
